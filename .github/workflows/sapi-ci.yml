name: Salesforce System API CI

"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      # FIX: Changed standard properties expansion to match direct environment variable handoffs cleanly
      - name: Configure Maven settings for Anypoint Exchange
        shell: bash
        run: |
          mkdir -p "$HOME/.m2"
          cat > "$HOME/.m2/settings.xml" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 https://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>anypoint-exchange-v3</id>
                <username>${env.ANYPOINT_USERNAME}</username>
                <password>${env.ANYPOINT_PASSWORD}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Validate required project files
        shell: bash
        run: |
          test -f pom.xml || { echo "ERROR: pom.xml was not found."; exit 1; }
          test -f mule-artifact.json || { echo "ERROR: mule-artifact.json was not found."; exit 1; }
          test -d src/main || { echo "ERROR: src/main was not found."; exit 1; }
          test -d src/test/munit || { echo "ERROR: src/test/munit was not found."; exit 1; }

      - name: Maven validate
        run: mvn --batch-mode --no-transfer-progress validate

      # FIX: Injected environment maps straight into the test lifecycle execution phase to authenticate repositories securely
      - name: Run MUnit tests and package
        env:
          ANYPOINT_USERNAME: ${{ secrets.ANYPOINT_USERNAME }}
          ANYPOINT_PASSWORD: ${{ secrets.ANYPOINT_PASSWORD }}
        run: mvn --batch-mode --no-transfer-progress package

      - name: Upload MUnit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: munit-reports
          path: |
            target/munit-reports/**
            target/surefire-reports/**
            target/site/munit/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload packaged Mule application
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: salesforce-sys-api-package
          path: |
            target/*.jar
            !target/*-original.jar
            !target/*-sources.jar
            !target/*-tests.jar
          if-no-files-found: error
          retention-days: 14

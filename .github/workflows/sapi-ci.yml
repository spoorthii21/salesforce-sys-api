name: Salesforce System API CI/CD

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"

  pull_request:
    branches:
      - develop
      - main

  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy SAPI to CloudHub 2.0
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  ci:
    name: Build, Test, Publish and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Set up Maven 3.9.9
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: "3.9.9"

      - name: Display Java and Maven versions
        shell: bash
        run: |
          java -version
          mvn --version

          ACTUAL_MAVEN_VERSION="$(mvn --version | head -1)"

          if [[ "$ACTUAL_MAVEN_VERSION" != *"Apache Maven 3.9.9"* ]]; then
            echo "::error::Expected Maven 3.9.9 but found: $ACTUAL_MAVEN_VERSION"
            exit 1
          fi

          echo "Java 17 and Maven 3.9.9 are active."

      - name: Validate required Anypoint build secrets
        shell: bash
        env:
          ANYPOINT_CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID }}
          ANYPOINT_CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET }}
        run: |
          MISSING=0

          if [ -z "$ANYPOINT_CLIENT_ID" ]; then
            echo "::error::ANYPOINT_CLIENT_ID repository secret is missing"
            MISSING=1
          fi

          if [ -z "$ANYPOINT_CLIENT_SECRET" ]; then
            echo "::error::ANYPOINT_CLIENT_SECRET repository secret is missing"
            MISSING=1
          fi

          if [ "$MISSING" -ne 0 ]; then
            exit 1
          fi

          echo "Required Anypoint build secrets are available."

      - name: Configure Maven settings for Anypoint Exchange
        shell: bash
        env:
          ANYPOINT_CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID }}
          ANYPOINT_CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET }}
        run: |
          mkdir -p "$HOME/.m2"

          cat > "$HOME/.m2/settings.xml" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 https://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>anypoint-exchange-v3</id>
                <username>~~~Client~~~</username>
                <password>${ANYPOINT_CLIENT_ID}~?~${ANYPOINT_CLIENT_SECRET}</password>
              </server>
            </servers>
          </settings>
          EOF

          echo "Maven settings.xml created successfully."

      - name: Validate Maven settings
        shell: bash
        run: |
          python3 <<'PY'
          import os
          import xml.etree.ElementTree as ET

          settings_path = os.path.expanduser("~/.m2/settings.xml")

          tree = ET.parse(settings_path)
          root = tree.getroot()

          namespace = {
              "m": "http://maven.apache.org/SETTINGS/1.0.0"
          }

          server_id = root.findtext(
              "m:servers/m:server/m:id",
              namespaces=namespace
          )

          username = root.findtext(
              "m:servers/m:server/m:username",
              namespaces=namespace
          )

          password = root.findtext(
              "m:servers/m:server/m:password",
              namespaces=namespace
          )

          if server_id != "anypoint-exchange-v3":
              raise RuntimeError(
                  "Maven server ID is missing or incorrect"
              )

          if username != "~~~Client~~~":
              raise RuntimeError(
                  "Connected App Maven username is incorrect"
              )

          if not password or "~?~" not in password:
              raise RuntimeError(
                  "Connected App Maven password format is incorrect"
              )

          print("Maven settings.xml is valid.")
          PY

      - name: Validate required project files
        shell: bash
        run: |
          test -f pom.xml || {
            echo "::error::pom.xml was not found."
            exit 1
          }

          test -f mule-artifact.json || {
            echo "::error::mule-artifact.json was not found."
            exit 1
          }

          test -f src/main/mule/global.xml || {
            echo "::error::global.xml was not found."
            exit 1
          }

          test -f src/main/mule/salesforce-sys-api.xml || {
            echo "::error::salesforce-sys-api.xml was not found."
            exit 1
          }

          test -d src/main || {
            echo "::error::src/main was not found."
            exit 1
          }

          test -d src/test/munit || {
            echo "::error::src/test/munit was not found."
            exit 1
          }

          echo "Required project files are available."

      - name: Validate Autodiscovery configuration
        shell: bash
        run: |
          AUTODISCOVERY_FILE="src/main/mule/global.xml"

          if ! grep -Fq "api-gateway:autodiscovery" "$AUTODISCOVERY_FILE"; then
            echo "::error::API Autodiscovery element is missing from global.xml"
            exit 1
          fi

          if ! grep -Fq 'apiId="${api.id}"' "$AUTODISCOVERY_FILE"; then
            echo "::error::Autodiscovery in global.xml must use apiId=\"\${api.id}\""
            exit 1
          fi

          if ! grep -Fq 'flowRef="salesforce-sys-api-main"' "$AUTODISCOVERY_FILE"; then
            echo "::error::Autodiscovery flowRef must be salesforce-sys-api-main"
            exit 1
          fi

          if ! grep -Fq 'xmlns:api-gateway="http://www.mulesoft.org/schema/mule/mule-gateway"' "$AUTODISCOVERY_FILE"; then
            echo "::error::API Gateway namespace is missing from global.xml"
            exit 1
          fi

          if ! grep -Fq 'http://www.mulesoft.org/schema/mule/mule-gateway/current/mule-gateway.xsd' "$AUTODISCOVERY_FILE"; then
            echo "::error::API Gateway schema location is missing from global.xml"
            exit 1
          fi

          echo "API Autodiscovery configuration in global.xml is valid."

      - name: Maven validate
        shell: bash
        run: |
          mvn \
            --batch-mode \
            --no-transfer-progress \
            --settings "$HOME/.m2/settings.xml" \
            -Dapi.id=1 \
            validate

      - name: Run MUnit tests and package
        shell: bash
        run: |
          mvn \
            --batch-mode \
            --no-transfer-progress \
            --settings "$HOME/.m2/settings.xml" \
            -Dapi.id=1 \
            package

      - name: Upload MUnit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: salesforce-sys-api-munit-reports
          path: |
            target/munit-reports/
            target/surefire-reports/
            target/site/munit/
            target/coverage-reports/
            target/**/*.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload packaged Mule application
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: salesforce-sys-api-package
          path: target/*.jar
          if-no-files-found: error
          retention-days: 14

      - name: Validate CloudHub and Autodiscovery variables
        if: >-
          ${{
            github.event_name == 'workflow_dispatch' &&
            github.ref == 'refs/heads/main' &&
            inputs.deploy == true
          }}
        shell: bash
        env:
          ANYPOINT_ORG_ID: ${{ vars.ANYPOINT_ORG_ID }}
          ANYPOINT_ENVIRONMENT: ${{ vars.ANYPOINT_ENVIRONMENT }}
          CLOUDHUB_TARGET: ${{ vars.CLOUDHUB_TARGET }}
          SAPI_APPLICATION_NAME: ${{ vars.SAPI_APPLICATION_NAME }}
          SAPI_API_ID: ${{ vars.SAPI_API_ID }}
        run: |
          REQUIRED_VARIABLES=(
            ANYPOINT_ORG_ID
            ANYPOINT_ENVIRONMENT
            CLOUDHUB_TARGET
            SAPI_APPLICATION_NAME
            SAPI_API_ID
          )

          MISSING=0

          for VARIABLE_NAME in "${REQUIRED_VARIABLES[@]}"; do
            if [ -z "${!VARIABLE_NAME}" ]; then
              echo "::error::$VARIABLE_NAME repository variable is missing"
              MISSING=1
            fi
          done

          if [ "$MISSING" -ne 0 ]; then
            exit 1
          fi

          if ! [[ "$SAPI_API_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::SAPI_API_ID must be the numeric API Instance ID from API Manager"
            exit 1
          fi

          echo "CloudHub 2.0 and Autodiscovery variables are available."
          echo "Environment: $ANYPOINT_ENVIRONMENT"
          echo "Target: $CLOUDHUB_TARGET"
          echo "Application: $SAPI_APPLICATION_NAME"
          echo "API Instance ID is configured."

      - name: Validate deployment and runtime secrets
        if: >-
          ${{
            github.event_name == 'workflow_dispatch' &&
            github.ref == 'refs/heads/main' &&
            inputs.deploy == true
          }}
        shell: bash
        env:
          CONNECTED_APP_CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID }}
          CONNECTED_APP_CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET }}
          ANYPOINT_PLATFORM_CLIENT_ID: ${{ secrets.ANYPOINT_PLATFORM_CLIENT_ID }}
          ANYPOINT_PLATFORM_CLIENT_SECRET: ${{ secrets.ANYPOINT_PLATFORM_CLIENT_SECRET }}
          MULE_KEY: ${{ secrets.MULE_KEY }}
        run: |
          REQUIRED_SECRETS=(
            CONNECTED_APP_CLIENT_ID
            CONNECTED_APP_CLIENT_SECRET
            ANYPOINT_PLATFORM_CLIENT_ID
            ANYPOINT_PLATFORM_CLIENT_SECRET
            MULE_KEY
          )

          MISSING=0

          for SECRET_NAME in "${REQUIRED_SECRETS[@]}"; do
            if [ -z "${!SECRET_NAME}" ]; then
              echo "::error::$SECRET_NAME repository secret is missing"
              MISSING=1
            fi
          done

          if [ "$MISSING" -ne 0 ]; then
            exit 1
          fi

          echo "Deployment credentials, Autodiscovery credentials, and encryption key are available."

      - name: Publish application to Anypoint Exchange
        if: >-
          ${{
            github.event_name == 'workflow_dispatch' &&
            github.ref == 'refs/heads/main' &&
            inputs.deploy == true
          }}
        shell: bash
        env:
          CONNECTED_APP_CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID }}
          CONNECTED_APP_CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET }}

          ANYPOINT_ORG_ID: ${{ vars.ANYPOINT_ORG_ID }}
          ANYPOINT_ENVIRONMENT: ${{ vars.ANYPOINT_ENVIRONMENT }}
          CLOUDHUB_TARGET: ${{ vars.CLOUDHUB_TARGET }}
          SAPI_APPLICATION_NAME: ${{ vars.SAPI_APPLICATION_NAME }}
          SAPI_API_ID: ${{ vars.SAPI_API_ID }}

          ANYPOINT_PLATFORM_CLIENT_ID: ${{ secrets.ANYPOINT_PLATFORM_CLIENT_ID }}
          ANYPOINT_PLATFORM_CLIENT_SECRET: ${{ secrets.ANYPOINT_PLATFORM_CLIENT_SECRET }}

          MULE_KEY: ${{ secrets.MULE_KEY }}
        run: |
          echo "Publishing Salesforce System API to Anypoint Exchange..."

          mvn \
            --batch-mode \
            --no-transfer-progress \
            --settings "$HOME/.m2/settings.xml" \
            deploy \
            -DskipMuleDeploy \
            -DskipTests

      - name: Deploy application to CloudHub 2.0
        if: >-
          ${{
            github.event_name == 'workflow_dispatch' &&
            github.ref == 'refs/heads/main' &&
            inputs.deploy == true
          }}
        shell: bash
        env:
          CONNECTED_APP_CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID }}
          CONNECTED_APP_CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET }}

          ANYPOINT_ORG_ID: ${{ vars.ANYPOINT_ORG_ID }}
          ANYPOINT_ENVIRONMENT: ${{ vars.ANYPOINT_ENVIRONMENT }}
          CLOUDHUB_TARGET: ${{ vars.CLOUDHUB_TARGET }}
          SAPI_APPLICATION_NAME: ${{ vars.SAPI_APPLICATION_NAME }}
          SAPI_API_ID: ${{ vars.SAPI_API_ID }}

          ANYPOINT_PLATFORM_CLIENT_ID: ${{ secrets.ANYPOINT_PLATFORM_CLIENT_ID }}
          ANYPOINT_PLATFORM_CLIENT_SECRET: ${{ secrets.ANYPOINT_PLATFORM_CLIENT_SECRET }}

          MULE_KEY: ${{ secrets.MULE_KEY }}
        run: |
          echo "Deploying Salesforce System API to CloudHub 2.0..."
          echo "Application: $SAPI_APPLICATION_NAME"
          echo "Environment: $ANYPOINT_ENVIRONMENT"
          echo "Target: $CLOUDHUB_TARGET"
          echo "API Autodiscovery ID is configured."

          mvn \
            --batch-mode \
            --no-transfer-progress \
            --settings "$HOME/.m2/settings.xml" \
            mule:deploy \
            -DskipTests

      - name: Write workflow summary
        if: always()
        shell: bash
        env:
          DEPLOY_REQUESTED: ${{ inputs.deploy || false }}
          SAPI_APPLICATION_NAME: ${{ vars.SAPI_APPLICATION_NAME }}
          ANYPOINT_ENVIRONMENT: ${{ vars.ANYPOINT_ENVIRONMENT }}
          CLOUDHUB_TARGET: ${{ vars.CLOUDHUB_TARGET }}
          SAPI_API_ID: ${{ vars.SAPI_API_ID }}
        run: |
          {
            echo "## Salesforce System API CI/CD"
            echo
            echo "- Repository: \`$GITHUB_REPOSITORY\`"
            echo "- Branch: \`$GITHUB_REF_NAME\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Java: \`17\`"
            echo "- Maven: \`3.9.9\`"
            echo "- Application: \`${SAPI_APPLICATION_NAME:-not configured}\`"
            echo "- Environment: \`${ANYPOINT_ENVIRONMENT:-not configured}\`"
            echo "- Target: \`${CLOUDHUB_TARGET:-not configured}\`"

            if [ -n "$SAPI_API_ID" ]; then
              echo "- API Autodiscovery configured: \`yes\`"
            else
              echo "- API Autodiscovery configured: \`no\`"
            fi

            echo "- Deployment requested: \`$DEPLOY_REQUESTED\`"

            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && \
               [ "$GITHUB_REF" = "refs/heads/main" ] && \
               [ "$DEPLOY_REQUESTED" = "true" ]; then
              echo "- Exchange publishing: \`Enabled\`"
              echo "- CloudHub 2.0 deployment: \`Enabled\`"
              echo "- API Autodiscovery properties: \`Enabled\`"
            else
              echo "- Exchange publishing: \`Not executed\`"
              echo "- CloudHub 2.0 deployment: \`Not executed\`"
              echo "- API Autodiscovery deployment: \`Not executed\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"